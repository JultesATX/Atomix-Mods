<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomix's Mod Hub</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --border-channel: #2a2f3a;
            --accent-glow: rgba(0, 210, 255, 0.4);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px 10px 20px;
        }

        header h1 {
            font-size: 2.3rem;
            margin: 0 0 5px 0;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0;
        }

        .wii-grid-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            justify-content: center;
            align-content: start;
        }

        .wii-channel {
            background-color: #1a1d24;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-channel);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            text-decoration: none;
            display: block;
        }

        .wii-channel:hover {
            transform: translateY(-5px);
            border-color: #00d2ff;
            box-shadow: 0 12px 25px var(--accent-glow);
        }

        .wii-channel img {
            width: 100%;
            height: auto;
            display: block;
        }

        .wii-channel.empty {
            opacity: 0.3;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16 / 9;
            color: var(--text-muted);
            font-size: 0.9rem;
            background-color: #14161b;
        }

        .wii-channel.empty:hover {
            transform: none;
            border-color: var(--border-channel);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #0b0d10;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Atomix's Mod Hub</h1>
        <p>Select a channel to launch</p>
    </header>

    <main class="wii-grid-container">
        <a href="legacy.html" class="wii-channel">
            <img src="legacy-cover.png" alt="Sonic 3 Legacy Edition">
        </a>

        <a href="smtitlecards.html" class="wii-channel">
            <img src="sm-titlecards-cover.jpeg" alt="Sonic Mania Title Cards">
        </a>

        <div class="wii-channel empty">
            [Empty Slot]
        </div>
    </main>

    <footer>
        <p>&copy; 2026 JultesATX.</p>
    </footer>

</body>
</html>
