<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomix's Mod Hub</title>
    <style>
        :root {
            --bg-color: #080a0f;
            --panel-bg: rgba(26, 31, 44, 0.75);
            --border-channel: rgba(0, 210, 255, 0.25);
            --accent-glow: rgba(0, 210, 255, 0.5);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            /* Fondo con un gradiente radial sutil para dar profundidad y evitar que se vea plano */
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(0, 110, 255, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(120, 0, 255, 0.08) 0%, transparent 50%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px 20px;
            position: relative;
        }

        /* Línea decorativa superior estilo interfaz moderna */
        header::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            margin: 15px auto 0 auto;
            border-radius: 2px;
        }

        header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #ffffff 30%, #00d2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 210, 255, 0.2);
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .wii-grid-container {
            max-width: 900px;
            width: 100%;
            margin: 10px auto 30px auto;
            padding: 0 20px;
            box-sizing: border-box;
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            justify-content: center;
            align-content: start;
        }

        .wii-channel {
            background-color: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--border-channel);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-color 0.3s ease;
            text-decoration: none;
            display: block;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        .wii-channel:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: #00d2ff;
            box-shadow: 0 18px 35px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .wii-channel img {
            width: 100%;
            height: auto;
            display: block;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .wii-channel.empty {
            opacity: 0.25;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16 / 9;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            background-color: rgba(15, 18, 25, 0.6);
            border: 2px dashed rgba(255, 255, 255, 0.1);
        }

        .wii-channel.empty:hover {
            transform: none;
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        footer {
            text-align: center;
            padding: 25px;
            background-color: rgba(6, 8, 12, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        /* Ajustes específicos para móviles */
        @media (max-width: 600px) {
            header {
                padding: 30px 15px 15px 15px;
            }
            header h1 {
                font-size: 1.9rem;
            }
            .wii-grid-container {
                grid-template-columns: 1fr;
                padding: 0 15px;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Atomix's Mod Hub</h1>
        <p>Select a channel to launch</p>
    </header>

    <main class="wii-grid-container">
        <a href="legacy.html" class="wii-channel">
            <img src="legacy-cover.png" alt="Sonic 3 Legacy Edition">
        </a>

        <a href="smtitlecards.html" class="wii-channel">
            <img src="sm-titlecards-cover.jpeg" alt="Sonic Mania Title Cards">
        </a>

        <div class="wii-channel empty">
            [Empty Slot]
        </div>
    </main>

    <footer>
        <p>&copy; 2026 JultesATX.</p>
    </footer>

</body>
</html>
