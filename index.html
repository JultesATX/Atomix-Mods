<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jultes' Mod Hub</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --card-hover: #232731;
            --accent-color: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 60px 20px 20px 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            background-color: var(--card-hover);
            border-color: rgba(0, 210, 255, 0.3);
        }

        .card-img {
            width: 100%;
            height: 160px;
            background-color: #2a2f3a;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-title {
            font-size: 1.25rem;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0 0 20px 0;
            flex: 1;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #0f1115;
            text-align: center;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <h1>Jultes' Mod Hub</h1>
        <p>Download center for my projects and modifications.</p>
    </header>

    <main class="container">
        <div class="card">
            <img src="legacy-cover.jpg" alt="Sonic 3 Legacy Edition" class="card-img">
            <div class="card-content">
                <h3 class="card-title">Sonic 3 Legacy Edition</h3>
                <p class="card-desc">A complete game overhaul mod featuring new mechanics, temporal distortions, and a renovated campaign.</p>
                <a href="legacy.html" class="btn">More Info</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 JultesATX. Powered by GitHub Pages.</p>
    </footer>

</body>
</html>
